<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindConnect - Đăng nhập</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* --- CẤU HÌNH CHUNG --- */
        body {
            font-family: 'Work Sans', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background: url('background.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
        }

        /* 1. NAVIGATION BAR */
        .landing-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            position: relative;
            z-index: 10;
            width: 100%;
            box-sizing: border-box; /* Đảm bảo padding không làm vỡ khung */
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-brand img {
            height: 50px;
            width: auto;
            object-fit: contain;
        }

        .brand-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 700;
            color: #D42E70;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .nav-item {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            font-size: 16px;
            transition: color 0.3s ease;
            position: relative;
            font-family: 'Work Sans', sans-serif;
        }

        .nav-item:hover { color: var(--deep-rose); }

        .btn-login-nav {
            padding: 10px 25px;
            background: #ffebee;
            color: #D42E70;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn-login-nav:hover { background: #ffcdd2; }

        /* 2. MAIN LOGIN AREA (Đã chỉnh sửa vị trí) */
        .main-container {
            flex: 1;
            width: 100%; /* Chiếm toàn bộ chiều rộng màn hình */
            box-sizing: border-box; /* Tính cả padding vào chiều rộng */
            
            display: flex;
            justify-content: flex-end; /* Đẩy nội dung sang phải */
            align-items: center; /* Căn giữa theo chiều dọc */
            
            /* ĐIỀU CHỈNH VỊ TRÍ TẠI ĐÂY */
            padding-right: 10%; /* Cách lề phải 10% màn hình -> Đẩy box vào vị trí đẹp */
            padding-bottom: 50px;
        }

        /* KHUNG ĐĂNG NHẬP */
        .login-card-glass {
            width: 350px; /* Thu nhỏ chiều rộng một chút cho thanh thoát */
            padding: 40px;
            border-radius: 30px;
            text-align: left;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
        }

        /* Toggle Role Switch */
        .role-switch-container {
            background: #e0e0e0;
            border-radius: 25px;
            padding: 4px;
            display: flex;
            margin-bottom: 30px;
        }

        .role-btn {
            flex: 1; text-align: center; padding: 10px; border-radius: 22px;
            cursor: pointer; font-weight: 600; color: #666; transition: 0.3s;
        }

        .role-btn.active {
            background: white; color: var(--deep-rose); box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Inputs */
        .input-group { margin-bottom: 20px; }
        .input-label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 8px; color: #333; }
        .custom-input {
            width: 100%; padding: 15px; background: #f0f2f5; border: none;
            border-radius: 12px; font-size: 14px; color: #333; outline: none; transition: 0.2s;
            box-sizing: border-box;
        }
        .custom-input:focus { background: #e8eaf6; box-shadow: 0 0 0 2px var(--primary-pink); }

        /* Submit Button */
        .btn-submit-gradient {
            width: 100%; padding: 15px; border: none; border-radius: 25px;
            background: linear-gradient(90deg, #ff9a9e 0%, #ffc3a0 100%);
            color: white; font-weight: 700; font-size: 16px; cursor: pointer;
            margin-top: 10px; transition: transform 0.2s;
            box-shadow: 0 5px 15px rgba(255, 154, 158, 0.4);
        }
        .btn-submit-gradient:hover { transform: translateY(-2px); }

        .footer-text { text-align: center; font-size: 12px; color: #999; margin-top: 20px; }
        .auth-toggle-text { text-align: center; font-size: 13px; color: #666; margin-top: 12px; }
        .auth-toggle-link { color: var(--deep-rose); cursor: pointer; font-weight: 600; }
        .auth-msg { margin-top: 12px; font-size: 13px; text-align: center; min-height: 18px; }
        .auth-msg.error { color: #c62828; }
        .auth-msg.success { color: #2e7d32; }
        #presentation-frame { display: none; }
    </style>
</head>
<body>

    <nav class="landing-nav">
        <div class="nav-brand">
            <img src="logonoword.png" alt="MindConnect Logo">
            <span class="brand-text">MindConnect</span>
        </div>
        <div class="nav-links">
            <a href="#" class="nav-item">Trang chủ</a>
            <a href="#" class="nav-item">Dịch vụ</a>
            <a href="#" class="nav-item">Về chúng tôi</a>
            <a href="#" class="nav-item">Liên hệ</a>
            <a href="#" class="btn-login-nav">Đăng nhập</a>
        </div>
    </nav>

    <div class="main-container">
        <div class="login-card-glass">
            <div class="role-switch-container">
                <div class="role-btn active" id="tab-student" onclick="switchRole('student')">Sinh viên</div>
                <div class="role-btn" id="tab-school" onclick="switchRole('school')">Nhà trường</div>
            </div>

            <form onsubmit="handleAuth(event)">
                <div class="input-group">
                    <label class="input-label">Tên đăng nhập</label>
                    <input id="username-input" type="text" class="custom-input" placeholder="Email / MSSV" required>
                </div>
                
                <div class="input-group">
                    <label class="input-label">Mật khẩu</label>
                    <input id="password-input" type="password" class="custom-input" placeholder="Mật khẩu" required>
                </div>

                <div class="input-group" id="confirm-password-group" style="display: none;">
                    <label class="input-label">Xác nhận mật khẩu</label>
                    <input id="confirm-password-input" type="password" class="custom-input" placeholder="Nhập lại mật khẩu">
                </div>

                <button id="auth-submit-btn" class="btn-submit-gradient">Truy cập</button>
            </form>

            <div class="auth-toggle-text">
                <span id="auth-toggle-label">Chưa có tài khoản?</span>
                <span class="auth-toggle-link" onclick="toggleAuthMode()" id="auth-toggle-link">Đăng ký</span>
            </div>
            <div id="auth-msg" class="auth-msg"></div>
            <p class="footer-text">Dữ liệu được mã hóa & Bảo mật tuyệt đối</p>
        </div>
    </div>

    <script>
        let currentRole = 'student';
        let isRegisterMode = false;
        const API_BASE = 'http://localhost:5000/api';

        function switchRole(role) {
            currentRole = role;
            document.getElementById('tab-student').classList.remove('active');
            document.getElementById('tab-school').classList.remove('active');
            document.getElementById('tab-' + role).classList.add('active');
        }

        function setAuthMessage(text, type = '') {
            const msgEl = document.getElementById('auth-msg');
            msgEl.className = 'auth-msg';
            if (type) msgEl.classList.add(type);
            msgEl.innerText = text;
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('confirm-password-group').style.display = isRegisterMode ? 'block' : 'none';
            document.getElementById('auth-submit-btn').innerText = isRegisterMode ? 'Đăng ký' : 'Truy cập';
            document.getElementById('auth-toggle-label').innerText = isRegisterMode ? 'Đã có tài khoản?' : 'Chưa có tài khoản?';
            document.getElementById('auth-toggle-link').innerText = isRegisterMode ? 'Đăng nhập' : 'Đăng ký';
            setAuthMessage('');
        }

        async function handleAuth(e) {
            e.preventDefault();
            const username = document.getElementById('username-input').value.trim();
            const password = document.getElementById('password-input').value;
            const confirmPassword = document.getElementById('confirm-password-input').value;

            if (isRegisterMode) {
                if (password.length < 6) {
                    return setAuthMessage('Mật khẩu phải từ 6 ký tự', 'error');
                }
                if (password !== confirmPassword) {
                    return setAuthMessage('Mật khẩu xác nhận không khớp', 'error');
                }
            }

            try {
                const endpoint = isRegisterMode ? '/auth/register' : '/auth/login';
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role: currentRole })
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.message || 'Có lỗi xảy ra');
                }

                if (isRegisterMode) {
                    setAuthMessage('Đăng ký thành công, bạn có thể đăng nhập ngay!', 'success');
                    toggleAuthMode();
                    return;
                }

                localStorage.setItem('mindconnect_user', JSON.stringify(data.user));
                if (currentRole === 'student') {
                    window.location.href = 'student.html';
                } else {
                    window.location.href = 'school.html';
                }
            } catch (error) {
                setAuthMessage(error.message || 'Không thể kết nối backend', 'error');
            }
        }
    </script>
</body>
</html>
