<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindConnect - Đăng nhập</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* --- CẤU HÌNH CHUNG --- */
        body {
            font-family: 'Work Sans', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background: url('background.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
        }

        /* 1. NAVIGATION BAR */
        .landing-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            position: relative;
            z-index: 10;
            width: 100%;
            box-sizing: border-box; /* Đảm bảo padding không làm vỡ khung */
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-brand img {
            height: 50px;
            width: auto;
            object-fit: contain;
        }

        .brand-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 700;
            color: #D42E70;
            letter-spacing: 0.5px;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .nav-item {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            font-size: 16px;
            transition: color 0.3s ease;
            position: relative;
            font-family: 'Work Sans', sans-serif;
        }

        .nav-item:hover { color: var(--deep-rose); }

        .btn-login-nav {
            padding: 10px 25px;
            background: #ffebee;
            color: #D42E70;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn-login-nav:hover { background: #ffcdd2; }

        /* 2. MAIN LOGIN AREA (Đã chỉnh sửa vị trí) */
        .main-container {
            flex: 1;
            width: 100%; /* Chiếm toàn bộ chiều rộng màn hình */
            box-sizing: border-box; /* Tính cả padding vào chiều rộng */
            
            display: flex;
            justify-content: flex-end; /* Đẩy nội dung sang phải */
            align-items: center; /* Căn giữa theo chiều dọc */
            
            /* ĐIỀU CHỈNH VỊ TRÍ TẠI ĐÂY */
            padding-right: 10%; /* Cách lề phải 10% màn hình -> Đẩy box vào vị trí đẹp */
            padding-bottom: 50px;
        }

        /* KHUNG ĐĂNG NHẬP */
        .login-card-glass {
            width: 350px; /* Thu nhỏ chiều rộng một chút cho thanh thoát */
            padding: 40px;
            border-radius: 30px;
            text-align: left;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
        }

        /* Toggle Role Switch */
        .role-switch-container {
            background: #e0e0e0;
            border-radius: 25px;
            padding: 4px;
            display: flex;
            margin-bottom: 30px;
        }

        .role-btn {
            flex: 1; text-align: center; padding: 10px; border-radius: 22px;
            cursor: pointer; font-weight: 600; color: #666; transition: 0.3s;
        }

        .role-btn.active {
            background: white; color: var(--deep-rose); box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Inputs */
        .input-group { margin-bottom: 20px; }
        .input-label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 8px; color: #333; }
        .custom-input {
            width: 100%; padding: 15px; background: #f0f2f5; border: none;
            border-radius: 12px; font-size: 14px; color: #333; outline: none; transition: 0.2s;
            box-sizing: border-box;
        }
        .custom-input:focus { background: #e8eaf6; box-shadow: 0 0 0 2px var(--primary-pink); }

        /* Submit Button */
        .btn-submit-gradient {
            width: 100%; padding: 15px; border: none; border-radius: 25px;
            background: linear-gradient(90deg, #ff9a9e 0%, #ffc3a0 100%);
            color: white; font-weight: 700; font-size: 16px; cursor: pointer;
            margin-top: 10px; transition: transform 0.2s;
            box-shadow: 0 5px 15px rgba(255, 154, 158, 0.4);
        }
        .btn-submit-gradient:hover { transform: translateY(-2px); }

        .footer-text { text-align: center; font-size: 12px; color: #999; margin-top: 20px; }
        .auth-status { min-height: 18px; margin-top: 12px; text-align: center; font-size: 12px; color: #D42E70; }
        #presentation-frame { display: none; }

        /* --- REGISTER FORM STYLES --- */
        .form-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn-back {
            background: #f0f2f5;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            color: #666;
        }
        .btn-back:hover {
            background: #e0e0e0;
            color: #333;
        }

        .form-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            font-weight: 700;
            color: #D42E70;
            margin: 0;
        }

        .link-register {
            color: #D42E70;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
        }
        .link-register:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #ffebee;
            color: #d32f2f;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: left;
            border: 1px solid #ffcdd2;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: left;
            border: 1px solid #c8e6c9;
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Input validation states */
        .input-error {
            border: 2px solid #ffcdd2 !important;
            background: #fff5f5 !important;
        }

        .input-success {
            border: 2px solid #c8e6c9 !important;
            background: #f5fff5 !important;
        }

        /* Smooth transitions between forms */
        .form-transition {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Forgot Password Styles */
        .forgot-password-link {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 15px;
        }

        .link-forgot {
            color: #888;
            text-decoration: none;
            font-size: 13px;
            transition: 0.2s;
        }
        .link-forgot:hover {
            color: #D42E70;
            text-decoration: underline;
        }

        .forgot-description {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <nav class="landing-nav">
        <div class="nav-brand">
            <img src="logonoword.png" alt="MindConnect Logo">
            <span class="brand-text">MindConnect</span>
        </div>
        <div class="nav-links">
            <a href="#" class="nav-item">Trang chủ</a>
            <a href="#" class="nav-item">Dịch vụ</a>
            <a href="#" class="nav-item">Về chúng tôi</a>
            <a href="#" class="nav-item">Liên hệ</a>
            <a href="#" class="btn-login-nav" onclick="showLoginForm(); return false;">Đăng nhập</a>
        </div>
    </nav>

    <div class="main-container">
        <div class="login-card-glass" id="login-form">
            <div class="role-switch-container">
                <div class="role-btn active" id="tab-student" onclick="switchRole('student')">Sinh viên</div>
                <div class="role-btn" id="tab-school" onclick="switchRole('school')">Nhà trường</div>
            </div>

            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label class="input-label">Tên đăng nhập</label>
                    <input type="text" id="login-email" class="custom-input" placeholder="Email / MSSV" required>
                </div>
                
                <div class="input-group">
                    <label class="input-label">Mật khẩu</label>
                    <input type="password" id="login-password" class="custom-input" placeholder="Mật khẩu" required>
                </div>

                <div class="forgot-password-link">
                    <a href="#" class="link-forgot" onclick="showForgotPasswordForm(); return false;">Quên mật khẩu?</a>
                </div>

                <button class="btn-submit-gradient" id="login-submit">Truy cập</button>
            </form>

            <div id="auth-status" class="auth-status"></div>
            <p class="footer-text">
                Chưa có tài khoản? <a href="#" class="link-register" onclick="showRegisterForm(); return false;">Đăng ký ngay</a>
            </p>
        </div>

        <!-- Registration Form -->
        <div class="login-card-glass hidden" id="register-form">
            <div class="form-header">
                <button class="btn-back" onclick="showLoginForm()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>
                <h2 class="form-title">Tạo tài khoản</h2>
            </div>

            <form onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label class="input-label">Tên người dùng</label>
                    <input type="text" id="reg-username" class="custom-input" placeholder="Nhập tên của bạn" required>
                </div>

                <div class="input-group">
                    <label class="input-label">Email</label>
                    <input type="email" id="reg-email" class="custom-input" placeholder="email@example.com" required>
                </div>
                
                <div class="input-group">
                    <label class="input-label">Mật khẩu</label>
                    <input type="password" id="reg-password" class="custom-input" placeholder="Ít nhất 6 ký tự" required minlength="6">
                </div>

                <div class="input-group">
                    <label class="input-label">Xác nhận mật khẩu</label>
                    <input type="password" id="reg-confirm-password" class="custom-input" placeholder="Nhập lại mật khẩu" required>
                </div>

                <div class="error-message hidden" id="reg-error"></div>
                <div class="success-message hidden" id="reg-success"></div>

                <button class="btn-submit-gradient" id="register-submit">
                    <span id="register-btn-text">Đăng ký</span>
                    <span id="register-loading" class="loading-spinner hidden"></span>
                </button>
            </form>

            <p class="footer-text">
                Đã có tài khoản? <a href="#" class="link-register" onclick="showLoginForm(); return false;">Đăng nhập</a>
            </p>
        </div>

        <!-- Forgot Password Form -->
        <div class="login-card-glass hidden" id="forgot-form">
            <div class="form-header">
                <button class="btn-back" onclick="showLoginForm()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </button>
                <h2 class="form-title">Quên mật khẩu</h2>
            </div>

            <p class="forgot-description">Nhập địa chỉ email của bạn. Chúng tôi sẽ gửi link đặt lại mật khẩu.</p>

            <form onsubmit="handleForgotPassword(event)">
                <div class="input-group">
                    <label class="input-label">Email</label>
                    <input type="email" id="forgot-email" class="custom-input" placeholder="email@example.com" required>
                </div>

                <div class="error-message hidden" id="forgot-error"></div>
                <div class="success-message hidden" id="forgot-success"></div>

                <button class="btn-submit-gradient" id="forgot-submit">
                    <span id="forgot-btn-text">Gửi link đặt lại</span>
                    <span id="forgot-loading" class="loading-spinner hidden"></span>
                </button>
            </form>

            <p class="footer-text">
                Nhớ mật khẩu rồi? <a href="#" class="link-register" onclick="showLoginForm(); return false;">Đăng nhập</a>
            </p>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3000';
        let currentRole = 'student';

        function switchRole(role) {
            currentRole = role;
            document.getElementById('tab-student').classList.remove('active');
            document.getElementById('tab-school').classList.remove('active');
            document.getElementById('tab-' + role).classList.add('active');
        }

        function showLoginForm() {
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('forgot-form').classList.add('hidden');
            clearAuthMessages();
        }

        function showRegisterForm() {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.remove('hidden');
            document.getElementById('forgot-form').classList.add('hidden');
            clearAuthMessages();
        }

        function showForgotPasswordForm() {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('forgot-form').classList.remove('hidden');
            clearAuthMessages();
        }

        function clearAuthMessages() {
            const errorEl = document.getElementById('reg-error');
            const successEl = document.getElementById('reg-success');
            if (errorEl) errorEl.classList.add('hidden');
            if (successEl) successEl.classList.add('hidden');
        }

        function showError(message) {
            const errorEl = document.getElementById('reg-error');
            if (errorEl) {
                errorEl.textContent = message;
                errorEl.classList.remove('hidden');
            }
        }

        function showSuccess(message) {
            const successEl = document.getElementById('reg-success');
            if (successEl) {
                successEl.textContent = message;
                successEl.classList.remove('hidden');
            }
        }

        function setRegisterLoading(loading) {
            const btn = document.getElementById('register-submit');
            const btnText = document.getElementById('register-btn-text');
            const spinner = document.getElementById('register-loading');
            if (btn) btn.disabled = loading;
            if (btnText) btnText.classList.toggle('hidden', loading);
            if (spinner) spinner.classList.toggle('hidden', !loading);
        }

        function setForgotLoading(loading) {
            const btn = document.getElementById('forgot-submit');
            const btnText = document.getElementById('forgot-btn-text');
            const spinner = document.getElementById('forgot-loading');
            if (btn) btn.disabled = loading;
            if (btnText) btnText.classList.toggle('hidden', loading);
            if (spinner) spinner.classList.toggle('hidden', !loading);
        }

        function showForgotError(message) {
            const errorEl = document.getElementById('forgot-error');
            const successEl = document.getElementById('forgot-success');
            if (errorEl) {
                errorEl.textContent = message;
                errorEl.classList.remove('hidden');
            }
            if (successEl) successEl.classList.add('hidden');
        }

        function showForgotSuccess(message) {
            const successEl = document.getElementById('forgot-success');
            const errorEl = document.getElementById('forgot-error');
            if (successEl) {
                successEl.textContent = message;
                successEl.classList.remove('hidden');
            }
            if (errorEl) errorEl.classList.add('hidden');
        }

        function validateEmail(email) {
            const emailRegex = /^\S+@\S+\.\S+$/;
            return emailRegex.test(email);
        }

        async function handleForgotPassword(e) {
            e.preventDefault();

            const email = document.getElementById('forgot-email').value.trim();
            const errorEl = document.getElementById('forgot-error');
            const successEl = document.getElementById('forgot-success');

            if (errorEl) errorEl.classList.add('hidden');
            if (successEl) successEl.classList.add('hidden');

            if (!email) {
                showForgotError('Vui lòng nhập địa chỉ email');
                return;
            }

            if (!validateEmail(email)) {
                showForgotError('Vui lòng nhập địa chỉ email hợp lệ');
                return;
            }

            setForgotLoading(true);

            try {
                const response = await fetch(`${API_BASE_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const result = await response.json().catch(() => ({}));

                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'Không thể gửi email đặt lại mật khẩu');
                }

                showForgotSuccess('Đã gửi link đặt lại mật khẩu đến email của bạn. Vui lòng kiểm tra hộp thư.');

                setTimeout(() => {
                    showLoginForm();
                }, 3000);

            } catch (error) {
                showForgotError(error.message);
            } finally {
                setForgotLoading(false);
            }
        }

        function validateRegistrationForm() {
            const username = document.getElementById('reg-username')?.value.trim() || '';
            const email = document.getElementById('reg-email')?.value.trim() || '';
            const password = document.getElementById('reg-password')?.value || '';
            const confirmPassword = document.getElementById('reg-confirm-password')?.value || '';

            if (!username) {
                showError('Vui lòng nhập tên người dùng');
                return false;
            }
            if (username.length < 2) {
                showError('Tên người dùng phải có ít nhất 2 ký tự');
                return false;
            }

            const emailRegex = /^\S+@\S+\.\S+$/;
            if (!email) {
                showError('Vui lòng nhập email');
                return false;
            }
            if (!emailRegex.test(email)) {
                showError('Vui lòng nhập địa chỉ email hợp lệ');
                return false;
            }

            if (!password) {
                showError('Vui lòng nhập mật khẩu');
                return false;
            }
            if (password.length < 6) {
                showError('Mật khẩu phải có ít nhất 6 ký tự');
                return false;
            }

            if (password !== confirmPassword) {
                showError('Mật khẩu xác nhận không khớp');
                return false;
            }

            return true;
        }

        async function handleRegister(e) {
            e.preventDefault();

            if (!validateRegistrationForm()) {
                return;
            }

            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const status = document.getElementById('reg-error');
            const successStatus = document.getElementById('reg-success');

            if (status) status.classList.add('hidden');
            if (successStatus) successStatus.classList.add('hidden');
            setRegisterLoading(true);

            try {
                const response = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        email,
                        password,
                        role: currentRole
                    })
                });

                const result = await response.json().catch(() => ({}));

                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'Đăng ký thất bại. Vui lòng thử lại.');
                }

                showSuccess('Đăng ký thành công! Đang chuyển hướng...');

                setTimeout(() => {
                    showLoginForm();
                    document.getElementById('login-email').value = email;
                    document.getElementById('login-email').focus();
                }, 1500);

            } catch (error) {
                showError(error.message);
            } finally {
                setRegisterLoading(false);
            }
        }

        function normalizeLoginIdentifier(value) {
            const raw = value.trim().toLowerCase();
            if (raw.includes('@')) return raw;
            return `${raw}@mindconnect.local`;
        }

        async function requestAuth(path, email, password) {
            const response = await fetch(`${API_BASE_URL}${path}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email,
                    password,
                    role: currentRole === 'school' ? 'school' : 'student'
                })
            });
            const result = await response.json().catch(() => ({}));
            return { response, result };
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = normalizeLoginIdentifier(document.getElementById('login-email').value);
            const password = document.getElementById('login-password').value;
            const status = document.getElementById('auth-status');
            const submit = document.getElementById('login-submit');

            status.innerText = 'Đang xác thực...';
            submit.disabled = true;

            try {
                let { response, result } = await requestAuth('/auth/login', email, password);

                if (response.status === 401) {
                    status.innerText = 'Tài khoản chưa có, đang tạo tài khoản demo...';
                    const registered = await requestAuth('/auth/register', email, password);
                    response = registered.response;
                    result = registered.result;
                }

                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'Không thể đăng nhập');
                }

                localStorage.setItem('mindconnect:auth', JSON.stringify(result.data));
                localStorage.setItem('mindconnect:role', currentRole);
                window.location.href = currentRole === 'student' ? 'student.html' : 'school.html';
            } catch (error) {
                status.innerText = `${error.message}. Nếu backend chưa chạy, hệ thống sẽ vào chế độ demo.`;
                setTimeout(() => {
                    window.location.href = currentRole === 'student' ? 'student.html' : 'school.html';
                }, 1200);
            } finally {
                submit.disabled = false;
            }
        }
    </script>
</body>
</html>
