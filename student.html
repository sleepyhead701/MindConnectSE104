<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindConnect - Student Workspace</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="student/student.css">
</head>

<body>

    <div class="desktop-nav">
        <a href="#" class="nav-brand" data-action="newsfeed">
            <img src="assets/images/logonoword.png" alt="MindConnect Logo">
            <span>MindConnect</span>
        </a>

        <div class="nav-menu">
            <a href="#" class="nav-icon active" data-nav-index="0" data-action="newsfeed">Home</a>
            <a href="#" class="nav-icon" data-nav-index="1" data-action="diary">Diary</a>
            <div class="profile-dropdown">
                <a href="#" class="nav-icon" data-nav-index="2" data-action="resources">Resources</a>
                <div class="profile-dropdown-menu">
                    <button type="button" class="dropdown-item" data-action="resources">
                        <span>A to Z topics</span>
                    </button>
                    <button type="button" class="dropdown-item" data-action="resources-videos">
                        <span>Videos</span>
                    </button>
                    <button type="button" class="dropdown-item" data-action="resources-books">
                        <span>Books</span>
                    </button>
                    <button type="button" class="dropdown-item" data-action="resources-blog">
                        <span>Blog</span>
                    </button>
                    <button type="button" class="dropdown-item" data-action="resources-podcasts">
                        <span>Podcasts</span>
                    </button>
                    <button type="button" class="dropdown-item" data-action="resources-tools">
                        <span>Tools</span>
                    </button>
                </div>
            </div>
            <div class="nav-icon" data-nav-index="3" data-action="stats">Stats</div>
            <div class="nav-icon" data-nav-index="4" data-action="chat">Chat</div>
        </div>

        <div class="nav-actions">
            <button class="btn-logout" data-action="logout">Log out</button>
            <div class="profile-dropdown">
                <div class="user-profile-badge" id="profileAvatar"></div>
                <div class="profile-dropdown-menu">
                    <div class="dropdown-item" style="pointer-events: none;">
                        <span>Student</span>
                    </div>
                    <div class="dropdown-item" data-action="profile">
                        <span>Profile</span>
                    </div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item" data-action="logout">
                        <span>Log out</span>
                    </div>
                </div>
            </div>
        </div>

        <button class="hamburger-btn" id="hamburgerBtn" data-action="toggle-mobile-menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>

    <div class="mobile-menu-overlay" id="mobileMenuOverlay">
        <div class="mobile-menu-content">
            <div class="nav-icon" data-nav-index="0" data-action="newsfeed">Home</div>
            <div class="nav-icon" data-nav-index="1" data-action="diary">Diary</div>
            <div class="nav-icon" data-nav-index="2" data-action="resources">Resources</div>
            <div class="nav-icon" data-nav-index="3" data-action="stats">Stats</div>
            <div class="nav-icon" data-nav-index="4" data-action="chat">Chat</div>
            <div class="mobile-menu-actions">
                <button class="btn-logout" data-action="logout">Log out</button>
            </div>
        </div>
    </div>

    <div id="presentation-frame">
        <div id="view-student" class="view-section">
            <div class="student-container">
                <div class="mobile-frame">

                    <div class="notion-layout">

                        <div id="student-main-content">
                        </div>
                    </div>

                    <div class="mobile-nav"></div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="student/app.js"></script>
    <script type="module">
        import { updateNav } from './student/utils/updateNav.js';
        import { renderStudentHome } from './student/NewsFeed/NewsFeed.js';
        import { renderStudentDiary } from './student/Diary/Diary.js';
        import { renderResourcesLibrary } from './student/Resources/Resources.js';
        import { navigateResourceMenu } from './student/Resources/ResourcesNavigation.js';
        import { renderStudentStats } from './student/Stats/Stats.js';
        import { renderProfile, logout } from './student/Profile/Profile.js';
        import { renderChat } from './student/ChatAI/ChatAI.js';

        document.addEventListener('DOMContentLoaded', () => {
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            const mobileMenuOverlay = document.getElementById('mobileMenuOverlay');
            const closeMobileMenu = () => {
                hamburgerBtn?.classList.remove('active');
                mobileMenuOverlay?.classList.remove('show');
            };

            hamburgerBtn?.addEventListener('click', () => {
                hamburgerBtn.classList.toggle('active');
                mobileMenuOverlay?.classList.toggle('show');
            });
            mobileMenuOverlay?.addEventListener('click', (event) => {
                if (event.target === mobileMenuOverlay) closeMobileMenu();
            });

            // click event cho navigation theo từng data-action
            document.querySelectorAll('.nav-icon, .nav-brand').forEach(icon => {
                icon.addEventListener('click', (event) => {
                    event.preventDefault();
                    closeMobileMenu();
                    const action = icon.getAttribute('data-action');
                    if (action === 'newsfeed') {
                        renderStudentHome();
                    }
                    else if (action === 'diary') {
                        renderStudentDiary();
                    }
                    else if (action === 'resources') {
                        renderResourcesLibrary();
                    }
                    else if (action === 'stats') {
                        renderStudentStats();
                    }
                    else if (action === 'chat') {
                        renderChat();
                    }
                    else {
                        alert(`Chức năng "${action}" đang được phát triển!`);
                    }
                });
            });

            document.querySelectorAll('.dropdown-item, .btn-logout').forEach(item => {
                item.addEventListener('click', () => {
                    const action = item.getAttribute('data-action');
                    if (action === 'profile') {
                        renderProfile();
                    }
                    else if (action === 'logout') {
                        logout();
                        console.log('User logged out');
                    }
                    else if (action === 'resources') {
                        renderResourcesLibrary();
                    }
                    else if (action === 'resources-videos') {
                        navigateResourceMenu('videos');
                    }
                    else if (action === 'resources-books') {
                        navigateResourceMenu('books');
                    }
                    else if (action === 'resources-blog') {
                        navigateResourceMenu('blog');
                    }
                    else if (action === 'resources-podcasts') {
                        navigateResourceMenu('podcasts');
                    }
                    else if (action === 'resources-tools') {
                        navigateResourceMenu('tools');
                    }
                    else {
                        alert(`Chức năng "${action}" đang được phát triển!`);
                    }
                });
            });
        });
        
    </script>
    <script>
        // If an <img> is present inside the avatar, remove any background so the image shows cleanly.
        (function(){
            const avatar = document.getElementById('profileAvatar');
            if(!avatar) return;

            const removeBgIfImg = () => {
                if (avatar.querySelector('img')) {
                    avatar.style.background = 'none';
                }
            };

            // Initial check
            removeBgIfImg();

            // Watch for future changes (e.g., avatar image added later)
            const mo = new MutationObserver(removeBgIfImg);
            mo.observe(avatar, { childList: true, subtree: true, attributes: true });
        })();
    </script>

</body>

</html>
